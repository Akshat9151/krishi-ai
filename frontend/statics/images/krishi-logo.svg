<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b5e20" />
      <stop offset="60%" stop-color="#2e7d32" />
      <stop offset="100%" stop-color="#4caf50" />
    </linearGradient>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66bb6a" />
      <stop offset="100%" stop-color="#a5d6a7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81c784" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2e7d32" stop-opacity="0"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Soft Background Badge -->
  <circle cx="100" cy="100" r="92" fill="#f1f8e9" stroke="#c8e6c9" stroke-width="4" />

  <!-- Digital Tech Neural Circuit Lines (Subtle AI Accent) -->
  <g stroke="#81c784" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <!-- Center stem to right circuits -->
    <path d="M 100 135 L 100 85 L 135 60 L 155 60" fill="none" />
    <path d="M 100 95 L 130 115 L 155 115" fill="none" />
    <!-- Center stem to left circuits -->
    <path d="M 100 110 L 70 85 L 50 85" fill="none" />
    <path d="M 70 85 L 55 110" fill="none" />
  </g>

  <!-- Circuit Node Dots -->
  <circle cx="155" cy="60" r="4.5" fill="#2e7d32" />
  <circle cx="155" cy="115" r="4" fill="#388e3c" />
  <circle cx="50" cy="85" r="4.5" fill="#2e7d32" />
  <circle cx="55" cy="110" r="3.5" fill="#43a047" />
  <circle cx="100" cy="85" r="3" fill="#66bb6a" />

  <!-- Organic Agricultural Leaf / Sprout (Left Leaf) -->
  <path d="M 100 148 C 65 140 45 105 52 75 C 65 72 95 82 100 108 Z" 
        fill="url(#leafGrad)" />

  <!-- Organic Agricultural Main Leaf (Right & Upward Growth) -->
  <path d="M 100 152 C 100 152 94 92 135 48 C 148 78 140 120 100 152 Z" 
        fill="url(#leafGrad)" filter="url(#subtleGlow)" />

  <!-- Leaf Central Vein (Glowing tech connection) -->
  <path d="M 100 148 Q 104 100 134 50" fill="none" stroke="#e8f5e9" stroke-width="3" stroke-linecap="round" />

  <!-- Small Sprout Golden Grain / Sun Sparkle (AI Intelligence Spark) -->
  <circle cx="137" cy="46" r="6" fill="#fbc02d" />
  <path d="M 137 36 L 137 56 M 127 46 L 147 46" stroke="#fff9c4" stroke-width="2" stroke-linecap="round" />
</svg>
