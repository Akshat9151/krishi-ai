<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings – Krishi AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="header.js"></script>
</head>
<body>

<!-- Unified Topbar Placeholder -->
<div id="ka-header-mount"></div>

<script>
  // 🔐 Login check
  const user = localStorage.getItem("loggedInUser");
  if (!user) window.location.href = "login.html";
</script>

<div class="settings-page" style="max-width: 540px; margin: 30px auto; padding: 20px;">

  <h2 style="color: #192a1e; margin-bottom: 20px;">⚙️ Farm Settings</h2>

  <div class="settings-card" style="background: #ffffff; border: 1.5px solid #e2ece4; border-radius: 16px; padding: 24px; box-shadow: 0 4px 16px rgba(11, 122, 58, 0.04);">

    

    <!-- 🌍 Language -->
    <div class="setting-item">
      <label for="language">Language 🌍</label>
      <select id="language">
        <option>English</option>
        <option>Hindi</option>
      </select>
    </div>

    <!-- 💾 Save -->
    <button class="settings-btn" onclick="saveSettings()">
      💾 Save Settings
    </button>

    <!-- 🚨 Danger Zone -->
    <div class="danger">
      <button onclick="logout()">🚪 Logout</button>
    </div>

  </div>
</div>

<script>
  const darkToggle = document.getElementById("darkToggle");

  // Load saved dark mode
  darkToggle.checked = localStorage.getItem("darkMode") === "true";

  function saveSettings() {
    const enabled = darkToggle.checked;
    localStorage.setItem("darkMode", enabled);

    document.body.classList.toggle("dark-mode", enabled);
    alert("✅ Settings Saved");
  }

  function logout() {
    localStorage.clear();
    window.location.href = "login.html";
  }
</script>

</body>
</html>
