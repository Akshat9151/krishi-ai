<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Profile – Krishi AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="header.js"></script>
</head>
<body>

<!-- Unified Topbar Placeholder -->
<div id="ka-header-mount"></div>

<div class="profile-page" style="margin-top: 20px;">
  
  <div class="profile-avatar" style="background: #e8f5ec; border: 1.5px solid #cce5d2; width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; margin: 0 auto 16px;">🌱</div>

  <h2 style="text-align: center; color: #192a1e; margin-bottom: 20px;">👤 My Farm Profile</h2>

  <div class="profile-card" style="background: #ffffff; border: 1.5px solid #e2ece4; border-radius: 16px; padding: 24px; box-shadow: 0 4px 16px rgba(11, 122, 58, 0.04); max-width: 480px; margin: 0 auto;">
    <p style="margin-bottom: 12px; font-size: 15px;"><strong>Username:</strong> <span id="name">Loading...</span></p>
    <p style="margin-bottom: 12px; font-size: 15px;"><strong>Role:</strong> Farmer 🌱</p>
    <p style="margin-bottom: 12px; font-size: 15px;"><strong>Last City:</strong> <span id="city">–</span></p>
    <p style="margin-bottom: 12px; font-size: 15px;"><strong>Preferred Season:</strong> <span id="season">–</span></p>
    <p style="margin-bottom: 0; font-size: 15px;"><strong>Auth Status:</strong> <span id="auth-status" style="color: #0b7a3a; font-weight: bold;">Verified ✔</span></p>
  </div>

  <div style="margin-top: 24px; text-align: center; display: flex; justify-content: center; gap: 12px;">
    <a href="dashboard.html" class="login-btn" style="text-decoration: none; padding: 10px 20px; border-radius: 8px; background: #e8f5ec; color: #0b7a3a; font-weight: 700; border: 1px solid #cce5d2; display: inline-flex; align-items: center; gap: 6px;">
      <i class="fa-solid fa-chart-pie"></i> Dashboard
    </a>
    <button id="logoutBtn" style="background-color: #fee2e2; border: 1px solid #fecaca; color: #dc2626; cursor: pointer; padding: 10px 20px; border-radius: 8px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px;">
      <i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out
    </button>
  </div>

</div>

<script>
  async function loadProfile() {
    const token = localStorage.getItem("accessToken");
    const localUser = localStorage.getItem("loggedInUser");
    const nameEl = document.getElementById("name");

    if (token) {
      try {
        const res = await fetch(getApiUrl("/auth/me"), {
          headers: {
            "Authorization": `Bearer ${token}`
          }
        });
        if (res.ok) {
          const data = await res.json();
          nameEl.textContent = data.username;
          localStorage.setItem("loggedInUser", data.username);
        } else {
          if (localUser) {
            nameEl.textContent = localUser + " (Offline)";
            document.getElementById("auth-status").textContent = "Session Expired";
            document.getElementById("auth-status").style.color = "#e53935";
          } else {
            window.location.href = "login.html";
            return;
          }
        }
      } catch (err) {
        console.warn("Could not verify auth with server:", err);
        nameEl.textContent = localUser || "Guest Farmer";
        document.getElementById("auth-status").textContent = "Offline Mode";
        document.getElementById("auth-status").style.color = "#fb8c00";
      }
    } else if (localUser) {
      nameEl.textContent = localUser;
      document.getElementById("auth-status").textContent = "Logged in (Local)";
    } else {
      window.location.href = "login.html";
      return;
    }

    document.getElementById("city").textContent = localStorage.getItem("lastCity") || "Not set";
    document.getElementById("season").textContent = localStorage.getItem("preferredSeason") || "Not set";
  }

  document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem("accessToken");
    localStorage.removeItem("loggedInUser");
    window.location.href = "login.html";
  });

  loadProfile();
</script>

</body>
</html>
