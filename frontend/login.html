<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krishi AI - Farmer Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="config.js"></script>
    <script src="i18n.js"></script>

    <!-- Animated background pattern (UNTOUCHED) -->
    <div class="bg-pattern"></div>
    
    <!-- Decorative leaves (UNTOUCHED) -->
    <div class="leaf-decoration" style="top: 10%; left: 5%; font-size: 60px;">🍃</div>
    <div class="leaf-decoration" style="top: 20%; right: 10%; font-size: 40px; animation-delay: 1s;">🌿</div>
    <div class="leaf-decoration" style="bottom: 20%; left: 15%; font-size: 50px; animation-delay: 2s;">🌱</div>
    <div class="leaf-decoration" style="bottom: 10%; right: 8%; font-size: 30px; animation-delay: 0.5s;">🍂</div>

    <!-- Centered Auth Wrapper -->
    <div class="auth-container">
        <div class="glass-card fade-in">

            <!-- Language Selector -->
            <div class="auth-lang-bar">
                <div id="loginLangSelector"></div>
            </div>

            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-seedling"></i>
                </div>
                <h1 data-i18n="welcomeKrishi">Welcome to Krishi AI</h1>
                <p class="tagline" data-i18n="loginTagline">Your Smart Agriculture Assistant</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="username">
                        <i class="fas fa-user"></i> <span data-i18n="username">Username</span>
                    </label>
                    <div class="input-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" required placeholder="Enter your username" data-i18n-placeholder="usernamePlaceholder" autocomplete="username"/>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> <span data-i18n="password">Password</span>
                    </label>
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" required placeholder="Enter your password" data-i18n-placeholder="passwordPlaceholder" autocomplete="current-password"/>
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> <span data-i18n="loginBtn">Login to Your Farm</span>
                </button>
            </form>

            <div class="register-link">
                <p><span data-i18n="newToKrishi">New to Krishi AI?</span> <a href="register.html"><span data-i18n="createAccount">Create an account</span> <i class="fas fa-arrow-right"></i></a></p>
            </div>

            <div id="loginStatus"></div>
            <div class="growing-bar"></div>
        </div>
    </div>

    <script>
        // Mount language picker widget
        if (window.krishiI18n) {
            window.krishiI18n.renderSelector('loginLangSelector');
            window.krishiI18n.translatePage();
        }

        const loginForm = document.getElementById("loginForm");
        const loginStatus = document.getElementById("loginStatus");
        const growingBar = document.querySelector(".growing-bar");
        
        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            
            // Show loading animation
            growingBar.style.display = "block";
            growingBar.style.animation = "grow 2s forwards";
            
            // Clear previous status
            loginStatus.className = "";
            loginStatus.textContent = "";
            
            try {
                const res = await fetch(getApiUrl("/auth/login"), {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({username, password})
                });
                
                const data = await res.json();
                
                // Hide loading animation
                growingBar.style.display = "none";
                
                if(res.status === 200){
                    loginStatus.textContent = window.krishiI18n ? window.krishiI18n.t("loginSuccess", "Login successful! Redirecting...") : "Login successful! Redirecting...";
                    loginStatus.className = "success";

                    // store token for authenticated requests
                    if(data && data.access_token){
                        localStorage.setItem("accessToken", data.access_token);
                    }

                    localStorage.setItem("loggedInUser", username);

                    // Redirect immediately to Dashboard shell
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 500);
                } else {
                    loginStatus.textContent = data.detail || "Login failed. Please check your credentials.";
                    loginStatus.className = "error";
                }
            } catch(err) {
                console.error(err);
                growingBar.style.display = "none";
                loginStatus.textContent = window.krishiI18n ? window.krishiI18n.t("serverError", "Error connecting to server. Please try again.") : "Error connecting to server. Please try again.";
                loginStatus.className = "error";
            }
        });
    </script>
</body>
</html>
