<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Krishi AI – Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <script src="config.js"></script>
    <script src="i18n.js"></script>

    <!-- Animated background pattern (UNTOUCHED) -->
    <div class="bg-pattern"></div>
    
    <!-- Decorative leaves (UNTOUCHED) -->
    <div class="leaf-decoration" style="top: 10%; left: 5%; font-size: 60px;">🍃</div>
    <div class="leaf-decoration" style="top: 20%; right: 10%; font-size: 40px; animation-delay: 1s;">🌿</div>
    <div class="leaf-decoration" style="bottom: 20%; left: 15%; font-size: 50px; animation-delay: 2s;">🌱</div>
    <div class="leaf-decoration" style="bottom: 10%; right: 8%; font-size: 30px; animation-delay: 0.5s;">🍂</div>

    <!-- Centered Auth Wrapper -->
    <div class="register-container">
        <div class="register-glass-card fade-in">

            <!-- Language Selector -->
            <div class="auth-lang-bar">
                <div id="registerLangSelector"></div>
            </div>

            <div class="register-header">
                <div class="logo">
                    <i class="fas fa-seedling"></i>
                </div>
                <h1 data-i18n="joinKrishi">Join Krishi AI</h1>
                <p class="tagline" data-i18n="registerTagline">Start your smart farming journey</p>
            </div>

            <form id="registerForm" class="register-form">
                <div class="input-group">
                    <label for="username">
                        <i class="fas fa-user"></i> <span data-i18n="username">Username</span>
                    </label>
                    <div class="input-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" required placeholder="Choose your username" data-i18n-placeholder="usernameChoose" autocomplete="username"/>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> <span data-i18n="password">Password</span>
                    </label>
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" required placeholder="Create a strong password" data-i18n-placeholder="passwordCreate" autocomplete="new-password"/>
                    </div>
                    <div class="password-strength">
                        <div class="strength-meter" id="passwordStrength"></div>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">
                        <i class="fas fa-lock"></i> <span data-i18n="confirmPassword">Confirm Password</span>
                    </label>
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirmPassword" required placeholder="Confirm your password" data-i18n-placeholder="confirmPasswordPlaceholder" autocomplete="new-password"/>
                    </div>
                </div>

                <div class="terms-container">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        <span data-i18n="agreeTerms">I agree to the Terms of Service and Privacy Policy</span>
                    </label>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-user-plus"></i> <span data-i18n="registerBtn">Create Account</span>
                </button>
            </form>

            <div class="register-link">
                <p><span data-i18n="alreadyHaveAccount">Already have an account?</span> <a href="login.html"><span data-i18n="loginHere">Login here</span> <i class="fas fa-arrow-right"></i></a></p>
            </div>

            <div id="registerStatus"></div>
            <div class="growing-bar"></div>
        </div>
    </div>

    <script>
        // Mount language picker widget
        if (window.krishiI18n) {
            window.krishiI18n.renderSelector('registerLangSelector');
            window.krishiI18n.translatePage();
        }

        const registerForm = document.getElementById("registerForm");
        const registerStatus = document.getElementById("registerStatus");
        const growingBar = document.querySelector(".growing-bar");
        const passwordInput = document.getElementById("password");
        const confirmPasswordInput = document.getElementById("confirmPassword");
        const passwordStrength = document.getElementById("passwordStrength");
        
        // Password strength indicator
        passwordInput.addEventListener("input", function() {
            const password = this.value;
            let strength = 0;
            
            if (password.length >= 8) strength += 25;
            if (/[A-Z]/.test(password)) strength += 25;
            if (/[0-9]/.test(password)) strength += 25;
            if (/[^A-Za-z0-9]/.test(password)) strength += 25;
            
            passwordStrength.style.width = strength + "%";
            
            if (strength < 50) {
                passwordStrength.style.background = "#ff4d4d";
            } else if (strength < 75) {
                passwordStrength.style.background = "#ffa64d";
            } else {
                passwordStrength.style.background = "#2ecc71";
            }
        });
        
        // Confirm password validation
        confirmPasswordInput.addEventListener("input", function() {
            if (this.value !== passwordInput.value) {
                this.style.borderColor = "#ff4d4d";
            } else {
                this.style.borderColor = "";
            }
        });
        
        registerForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const confirmPassword = document.getElementById("confirmPassword").value.trim();
            
            // Validate passwords match
            if (password !== confirmPassword) {
                registerStatus.textContent = window.krishiI18n ? window.krishiI18n.t("passwordsDoNotMatch", "Passwords do not match!") : "Passwords do not match!";
                registerStatus.className = "error";
                return;
            }
            
            // Validate password strength
            if (password.length < 8) {
                registerStatus.textContent = window.krishiI18n ? window.krishiI18n.t("passwordLengthWarn", "Password must be at least 8 characters long!") : "Password must be at least 8 characters long!";
                registerStatus.className = "error";
                return;
            }
            
            // Show loading animation
            growingBar.style.display = "block";
            growingBar.style.animation = "grow 2s forwards";
            
            // Clear previous status
            registerStatus.className = "";
            registerStatus.textContent = "";
            
            try {
                const res = await fetch(getApiUrl("/auth/register"), {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({username, password})
                });
                
                const data = await res.json();
                
                // Hide loading animation
                growingBar.style.display = "none";
                
                if(res.ok){
                    registerStatus.textContent = window.krishiI18n ? window.krishiI18n.t("registerSuccess", "Registration successful! Redirecting...") : "Registration successful! Redirecting...";
                    registerStatus.className = "success";
                    
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1200);
                } else {
                    registerStatus.textContent = data.detail || "Registration failed. Please try a different username.";
                    registerStatus.className = "error";
                }
            } catch(err) {
                console.error(err);
                growingBar.style.display = "none";
                registerStatus.textContent = window.krishiI18n ? window.krishiI18n.t("serverError", "Error connecting to server. Please try again.") : "Error connecting to server. Please try again.";
                registerStatus.className = "error";
            }
        });
    </script>
</body>
</html>
