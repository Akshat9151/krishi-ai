<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weather Insights | Krishi AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Unified Topbar Placeholder -->
<div id="ka-header-mount"></div>

<main>
  <section class="feature-section">
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
      <div style="width: 44px; height: 44px; border-radius: 12px; background: #e0f2fe; color: #0284c7; display: flex; align-items: center; justify-content: center; font-size: 22px;">
        <i class="fa-solid fa-cloud-sun"></i>
      </div>
      <div>
        <h2 style="margin: 0; font-size: 20px; color: #192a1e;" data-i18n="weatherTitle">🌦️ Weather Insights</h2>
        <p style="margin: 0; font-size: 13px; color: #5c6f60;">Live meteorological conditions & tailored farming advisories</p>
      </div>
    </div>

    <form id="weatherForm">
      <div class="input-group">
        <label for="city" style="font-weight: 700;">Enter Village / City / District:</label>
        <div style="display: flex; gap: 10px;">
          <input type="text" id="city" placeholder="e.g., Jaipur, Karnal, Nagpur" required style="flex: 1;" />
          <button type="submit">
            <i class="fa-solid fa-magnifying-glass"></i> Check
          </button>
        </div>
      </div>
    </form>

    <div id="weatherResult" style="margin-top: 20px;"></div>
  </section>
</main>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="header.js"></script>
<script src="weather.js"></script>
</body>
</html>
